name: verify

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .bin
          key: godot-4.7-stable-linux-x86_64
      - name: Headless verification (import + world graph + save round trip)
        run: tools/verify.sh
      - name: Regenerate assets and check they are reproducible
        run: |
          python3 -m pip install --quiet pillow numpy
          python3 tools/gen_assets/textures.py > /dev/null
          python3 tools/gen_assets/models.py > /dev/null
          git diff --stat -- assets/textures assets/models | tail -3
      - name: Render a screenshot tour with software OpenGL
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1 mesa-utils > /dev/null
          tools/screenshots.sh nexus apartment forest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/tour

  web:
    name: browser build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and the web export templates
        uses: actions/cache@v4
        with:
          path: |
            .bin
            ~/.local/share/godot/export_templates
          key: godot-web-4.7-stable
      - name: Export the browser build (verifies the world graph first)
        run: tools/export_web.sh
      - name: Boot it in a real browser and screenshot it
        run: |
          npm --silent install --no-save playwright@1.56
          npx playwright install --with-deps chromium
          node tools/verify_web.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-build
          path: |
            build/web
            screenshots/web_*.png
